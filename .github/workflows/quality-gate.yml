# The quality gate, enforced. Every push/PR runs the same fence the repo runs locally:
# strict typecheck, lint (0 errors), the unit suite (incl. the Aspen golden hash and the
# initiation-ledger attacks), and the Firestore rules suite under the emulator.
# What's green can only stay green — the ratchet never loosens.
name: Quality gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5   # the Firestore emulator is a Java process
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix seed --ignore-scripts
      - name: Typecheck (full strict)
        run: npm run typecheck
      - name: Lint (0 errors)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Independent browser build (Firebase imports forbidden)
        run: npm run seed:web:build
        env:
          SEED_WEB_ORIGIN: https://app.example.test
          SEED_IDENTITY_ISSUER: https://identity.example.test/realms/lightseed
      - name: Firestore rules tests (emulator)
        run: npx firebase-tools emulators:exec --only firestore "npx vitest run --config vitest.rules.config.ts" --project demo-lifeseed

  seed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix seed --ignore-scripts
      - name: Install PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - name: PostgreSQL migration tests (isolated cluster)
        run: npm run test:seed
        env:
          SEED_PG_BIN: /usr/lib/postgresql/16/bin

  seed-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Independent API Docker proof (disposable installation)
        run: npm run test:seed:docker
      - run: npm ci --prefix seed --ignore-scripts
      - name: OpenID Connect proof (disposable issuer)
        run: npm run test:seed:identity

  # The functions are their own compilation unit with their own node_modules — the app gate's
  # root tsconfig excludes them, so they get their own job.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - name: Typecheck functions
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: functions
