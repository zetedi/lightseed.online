# The Seed — a whole lightseed node's soil in one file (seed/README.md).
# Postgres first; the Supabase-shaped organs (auth, storage, realtime, edge functions)
# join this compose as each is ported. `docker compose up -d` and the soil is ready.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lightseed
      POSTGRES_PASSWORD: ${SEED_DB_PASSWORD:?Set SEED_DB_PASSWORD in seed/.env before starting}
      POSTGRES_DB: lightseed
    ports:
      - '127.0.0.1:${SEED_DB_PORT:-5433}:5432'
    volumes:
      - ./data:/var/lib/postgresql/data
      # Schema is managed by `npm run seed:migrate`, including on first boot.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lightseed -d lightseed']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    profiles: [api]
    build:
      context: ..
      dockerfile: seed/Dockerfile
    restart: unless-stopped
    env_file: runtime.env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: lightseed
      SEED_API_HOST: 0.0.0.0
      SEED_API_PORT: 8081
      SEED_MEDIA_DIR: /app/media
      SEED_NODE_ORIGIN: ${SEED_NODE_ORIGIN:-}
      SEED_FACE_DOORS: ${SEED_FACE_DOORS:-}
      # THE MAIL ORGAN (ring 2026-11-03): the charter names the node and its sender; the SMTP
      # courier and the push key live in runtime.env (SEED_SMTP_URL, SEED_VAPID_PRIVATE_KEY).
      SEED_CHARTER: /app/charter/node.json
      SEED_MAIL_POSTAL: ${SEED_MAIL_POSTAL:-}
    ports:
      - '127.0.0.1:${SEED_API_PORT:-8081}:8081'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      # The charter directory holds node.json (seed:configure's output); an empty one means no mail organ, said at startup.
      - ${SEED_CHARTER_DIR:-./charter}:/app/charter:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8081/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 5
  # THE EDGE (ring 2026-11-01): the TLS reverse proxy that serves the built application
  # (`npm run build:independent` → dist-independent/) and fronts the API and the identity
  # issuer (seed/Caddyfile). `docker compose --profile api --profile edge up -d`. The issuer
  # lives in identity/compose.yml and joins the shared `edge` network only — never this
  # project's database network.
  proxy:
    profiles: [edge]
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SEED_APP_HOST: ${SEED_APP_HOST:?Set the application host, e.g. app.your-node.example}
      SEED_IDENTITY_HOST: ${SEED_IDENTITY_HOST:?Set the identity host, e.g. identity.your-node.example}
      SEED_TLS: ${SEED_TLS:-acme}
      SEED_ACME_EMAIL: ${SEED_ACME_EMAIL:-}
    ports:
      - '${SEED_EDGE_HTTP_PORT:-80}:80'
      - '${SEED_EDGE_HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SEED_APP_DIST:-../dist-independent}:/srv/app:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [default, edge]
    depends_on:
      api:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

networks:
  default: {}
  edge:
    name: lightseed_edge

volumes:
  media_data:
  caddy_data:
  caddy_config:
