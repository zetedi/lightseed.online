# Separate identity installation: no access to the application database or credentials.
services:
  identity-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${SEED_IDENTITY_DB_PASSWORD:?Set an independent database password}
    volumes:
      - identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 3s
      retries: 15
  identity:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start', '--import-realm']
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${SEED_IDENTITY_DB_PASSWORD:?Set an independent database password}
      KC_HOSTNAME: ${SEED_IDENTITY_ORIGIN:?Set the public HTTPS identity origin}
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${SEED_IDENTITY_ADMIN:?Set the bootstrap administrator name}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SEED_IDENTITY_ADMIN_PASSWORD:?Set the bootstrap administrator password}
    ports:
      - '127.0.0.1:${SEED_IDENTITY_PORT:-8082}:8080'
    volumes:
      - type: bind
        source: ${SEED_IDENTITY_REALM_FILE:?Set the absolute path to the prepared realm file}
        target: /opt/keycloak/data/import/lightseed-realm.json
        read_only: true
    depends_on:
      identity-db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  identity_data:
