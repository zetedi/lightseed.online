# THE NODE'S OWN DOOR, IN ITS OWN CLOTHES (2026-11-19): Keycloak's current login theme with one
# stylesheet laid over it. No template is overridden, so an issuer upgrade keeps its own pages
# and scripts; only colours, shapes, the mark and the favicon are ours. Nothing is fetched from
# another host. The realm names this theme (`loginTheme`, src/domain/seedIdentity.mjs).
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/lightseed.css
